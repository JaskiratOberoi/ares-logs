services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ARES_DATA_DIR: /data
    volumes:
      - ares-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ares-data:
  caddy-data:
  caddy-config:
