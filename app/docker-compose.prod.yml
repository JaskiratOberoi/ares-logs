# Production on the Ares Labs host: the app only, bound to localhost.
# The host's existing Caddy (ports 80/443) terminates TLS for logs.ares-labs.com
# and proxies to 127.0.0.1:3170. Nothing here binds a public port.
name: ares-sales

services:
  app:
    build: .
    image: ares-sales:latest
    container_name: ares-sales-app
    restart: unless-stopped
    environment:
      ARES_DATA_DIR: /data
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:3170:3000"
    volumes:
      - ares-sales-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ares-sales-data:
